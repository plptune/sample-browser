# Contrôles à chaque push : Rust (fmt, clippy, tests dont la parité avec le prototype),
# contrat TypeScript à jour, build de l'app et de Storybook.
name: CI

on:
  push:
    branches: [main, "claude/magical-cannon-voq3it"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (WebKitGTK pour compiler Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests Rust (régénère src/api/bindings.ts)
        run: cargo test --workspace
      - name: Empreinte de parité régénérée depuis le mock TypeScript
        run: pnpm parity:fixture
      - name: Fichiers générés à jour
        run: git diff --exit-code -- src/api/bindings.ts crates/crate-core/tests/fixtures/prototype.json
      - run: pnpm build
      - run: pnpm build-storybook
