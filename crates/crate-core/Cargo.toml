[package]
name = "crate-core"
description = "Cœur de Crate : modèle, langage de recherche, arbre, données. Aucune dépendance à Tauri."
version.workspace = true
edition.workspace = true

[features]
# Dérive specta::Type sur le modèle, pour générer les types TypeScript (activé par src-tauri).
specta = ["dep:specta"]

[dependencies]
cpal = "0.18.2"
notify = "8.2.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true }
specta = { workspace = true, optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "aiff", "flac", "mp3", "ogg", "vorbis", "pcm", "adpcm"] }
# Modèle de tags (EfficientAT mn04_as, format NNEF) : inférence en pur Rust, sans le parseur ONNX (binaire plus léger).
tract-nnef = "=0.23.8"

[dev-dependencies]
serde_json = { workspace = true }
