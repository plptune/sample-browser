[package]
name = "crate-app"
description = "Crate — couche Tauri : commandes fines au-dessus de crate-core"
version.workspace = true
edition.workspace = true

[lib]
name = "crate_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crate-core = { path = "../crates/crate-core", features = ["specta"] }
tauri = { version = "2", features = [] }
serde = { workspace = true }
specta = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2.8.1"
